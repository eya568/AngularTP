<div class="mt-4 space-y-3">

  <!-- Check if tasks exist -->
  <div *ngIf="tasks && tasks.length > 0; else noTasks" class="space-y-3"  @fadeInOut>
    @for (task of tasks; track task.title) {
      <div
        class="p-3 rounded-xl shadow-sm"
        appHighlightStatus="{{ task.status }}">

        <!-- Apply priorityColor pipe here -->
        <p class="font-semibold" [ngClass]="task.priority | priorityColor">
          {{ task.title }}
        </p>

        <p class="text-sm text-gray-500">
          Priorité : {{ task.priority }} · {{ task.status }}
        </p>
      </div>
      <button
  class="mt-2 px-3 py-1 bg-blue-500 text-white rounded"
  (click)="changeStatus(task)">
  Changer statut
</button>
    }
  </div>

  <!-- Else template -->
  <ng-template #noTasks>
    <p class="text-gray-400 italic">Aucune tâche</p>
  </ng-template>

</div>
