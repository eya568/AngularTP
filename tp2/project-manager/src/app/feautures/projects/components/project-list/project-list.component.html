
<div class="max-w-3xl mx-auto space-y-6">

<!-- Dashboard Card -->
<div class="bg-white rounded-2xl shadow p-6">
  <app-dashboard [projects]="projects"></app-dashboard>
</div>

  <div *ngIf="message"
     class="fixed top-5 right-5 bg-green-500 text-white px-4 py-2 rounded shadow transition-all duration-500">
  {{ message }}
</div>
  <!-- Search input -->
  <input
    [(ngModel)]="searchTerm"
    placeholder="Rechercher un projet"
    class="w-full p-3 border border-gray-300 rounded-xl mb-4 bg-white text-gray-900 placeholder-gray-500"
  />

  <!-- Check if filtered projects exist -->
  <div *ngIf="filteredProjects.length > 0; else noProjects" class="space-y-6">
    
    @for (project of filteredProjects; track project.name) {

      <div class="bg-white rounded-2xl shadow-md shadow-green-200/40 p-6 space-y-3 border border-green-200">
        
        <h2 class="text-2xl font-bold text-green-700">{{ project.name }}</h2>
        
        <p class="text-green-500">{{ project.description }}</p>
        <span class="inline-block px-3 py-1 text-sm rounded-full bg-green-100 text-green-700 font-medium">{{ project.status }}</span>
        <button
      class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium
             bg-green-600 text-white shadow-sm
             hover:bg-green-700 hover:shadow-md
             active:scale-95 transition-all duration-200"
      (click)="selectProject(project)">
      👁 Détails
    </button>

    <button
      class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium
             bg-red-500 text-white shadow-sm
             hover:bg-red-600 hover:shadow-md
             active:scale-95 transition-all duration-200"
      (click)="deleteProject(project)">
      🗑 Supprimer
    </button>
        <app-project-details
          *ngIf="selectedProject === project"
          [project]="selectedProject">
        </app-project-details>
      </div>
    }
  </div>
  <!-- Else template -->
  <ng-template #noProjects>
    <p class="text-gray-400 italic">Aucun projet trouvé</p>
  </ng-template>

</div>
