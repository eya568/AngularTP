<div class="max-w-3xl mx-auto space-y-6">

  @for (project of projects; track project.name) {
    <div
      class="bg-white rounded-2xl shadow-md shadow-green-200/40 p-6 space-y-3 border border-green-200">

      <h2 class="text-2xl font-bold text-green-700">
        {{ project.name }}
      </h2>

      <p class="text-green-500">
        {{ project.description }}
      </p>

      <span
        class="inline-block px-3 py-1 text-sm rounded-full bg-green-100 text-green-700 font-medium">
        {{ project.status }}
      </span>

      <app-task-list [tasks]="project.tasks"></app-task-list>
    </div>
  }
</div>
