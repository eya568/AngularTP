<div class="grid grid-cols-1 md:grid-cols-3 gap-4">

  <div class="p-4 bg-white shadow rounded-xl text-center">
    <p class="text-gray-500">Projets</p>
    <h2 class="text-2xl font-bold">{{ totalProjects }}</h2>
  </div>

  <div class="p-4 bg-white shadow rounded-xl text-center">
    <p class="text-gray-500">Tâches</p>
    <h2 class="text-2xl font-bold">{{ totalTasks }}</h2>
  </div>

  <div class="p-4 bg-white shadow rounded-xl text-center">
    <p class="text-gray-500">Progression globale</p>
    <h2 class="text-2xl font-bold">
      {{ globalProgress | number:'1.0-0' }}%
    </h2>
  </div>

</div>
<div class="flex justify-center mt-8">

  <div class="relative w-32 h-32">

    <!-- Cercle de fond -->
    <div class="w-32 h-32 rounded-full border-8 border-gray-200"></div>

    <!-- Cercle de progression -->
    <div
      class="absolute top-0 left-0 w-32 h-32 rounded-full border-8 border-green-500"
      [style.clipPath]="'inset(0 ' + (100 - globalProgress) + '% 0 0)'">
    </div>

    <!-- Texte centre -->
    <div class="absolute inset-0 flex items-center justify-center">
      <span class="text-lg font-bold">
        {{ globalProgress | number:'1.0-0' }}%
      </span>
    </div>

  </div>

</div>
