<!-- Wrapper racine : applique le fond global -->
<div class="min-h-screen" [ngClass]="darkMode ? 'bg-gray-900' : 'bg-gradient-to-br from-green-100 via-amber-50 to-orange-100'">  <!-- Barre de navigation -->
  <header class="flex justify-between items-center px-6 py-4
                 bg-white dark:bg-gray-800 dark:text-white
                 shadow dark:shadow-gray-700">
    <h1 class="text-xl font-bold text-green-700 dark:text-green-400">
      🗂️ Mes Projets
    </h1>

    <!-- Bouton toggle -->
   <button
    class="m-4 px-4 py-2 rounded bg-gray-200  text-gray-800 dark:bg-gray-700 dark:text-white"
    (click)="toggleTheme()">
    🌙 Mode sombre / clair
  </button>
  </header>

  <!-- Contenu principal -->
  <main class="p-6">
    <app-project-list></app-project-list>
  </main>
</div>
